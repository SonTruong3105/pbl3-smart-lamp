server:
  version: 2.0.0
  host: 0.0.0.0
  port: 8000
  auth:
    enabled: false

selected_module:
  Intent: function_call
  VAD: silero
  ASR: chunkformer
  LLM: hybrid
  TTS: vieneu
  Memory: local

intent:
  url: http://127.0.0.1:11434/api/chat
  model: qwen2.5:1.5b
  timeout: 10.0
  num_predict: 48
  num_gpu: 99
  num_thread: 8
  num_ctx: 512
  num_keep: 256
  num_batch: 128
  keep_alive: -1
  temperature: 0.05
  cache_size: 500
  fallback_model: null

VAD:
  silero:
    type: silero
    model_dir: models/snakers4_silero-vad
    threshold: 0.6
    # Hạ ngưỡng "im lặng" để các đoạn ngưng ngắn trong câu tiếng Việt không bị tính là kết thúc.
    threshold_low: 0.2
    # 400ms quá ngắn (log cũ: speech=448ms silence=416ms -> cắt giữa câu).
    silence_duration_ms: 600
    min_speech_duration_ms: 300
    pre_speech_ms: 400

LLM:
  hybrid:
    priority:
      - ollama_chat
      - groq
    fail_threshold: 3
    cooldown_sec: 300
    history_keep: 4
    max_history_chars: 1400
    routing:
      enable: true
      groq_patterns:
        - giá vàng|chứng khoán|tỷ giá|bitcoin|giá đô|giá xăng
        - tin(\s+(tức|thể thao|bóng đá|công nghệ|kinh tế|thế giới|trong nước|nóng|nhanh))?|thời sự|bản tin|điểm tin|sự kiện mới
        - kết quả bóng đá|tỷ số|lịch thi đấu|world cup|euro|v-league|ngoại hạng anh
        - thời tiết.*(hà nội|sài gòn|đà nẵng|hải phòng|cần thơ|huế)
        - tại sao|vì sao|giải thích|phân tích|so sánh|như thế nào|ra sao
        - kể chuyện|viết thơ|sáng tác|tâm sự
        - code|python|javascript|html|sql|thuật toán
        - lịch sử|địa lý|khoa học|kiến thức|định nghĩa|là gì|ai là|ở đâu|khi nào|năm nào|bao nhiêu người
        - tóm tắt|ngắn gọn|chuyên sâu|chi tiết|học tập|bài tập
        - đặt lịch|nhắc nhở|lịch hẹn|sự kiện.*(ngày|tuần|tháng)
      groq_tools:
        - web_search
        - get_news
        - get_exchange_rate
        - get_weather
        - get_forecast
    ollama_chat:
      type: ollama
      url: http://127.0.0.1:11434/api/chat
      model: qwen3.5:2b-q4_K_M
      temperature: 0.05
      num_predict: 120
      num_ctx: 4096
      num_keep: 2048
      num_batch: 512
      top_k: 20
      top_p: 0.85
      repeat_penalty: 1.1
      num_gpu: 99
      keep_alive: -1
      think: false
    groq:
      type: openai_compatible
      base_url: https://api.groq.com/openai/v1
      api_key: ${GROQ_API_KEY}
      model: qwen/qwen3.8-27b
      temperature: 0.3
      num_predict: 256
      request_timeout: 10.0
      max_concurrency: 4
    system_prompt: |
      Bạn là "Đèn", trợ lý trong đèn bàn. Xưng "mình", gọi "bạn". Trả lời tiếng Việt tự nhiên, ngắn gọn (1-2 câu, dưới 30 từ). Không dùng emoji, markdown, chữ nước ngoài hay tự nhận là AI.

      Nguyên tắc:
      - Câu ngắn/mơ hồ ("a", "ơ", "ừ", nghe chưa rõ): hỏi lại nhẹ nhàng, không suy đoán.
      - Khi người dùng yêu cầu thao tác hoặc tra cứu (hoặc đồng ý gợi ý trước đó): gọi đúng tool được cấp; tuyệt đối không nói đã/sẽ làm nếu chưa gọi tool. Nếu thiếu tool phù hợp, báo thiết bị chưa hỗ trợ.
      - Tin tức, sự kiện, tỷ số, giá cả, kiến thức thực tế: BẮT BUỘC gọi web_search nếu có; nếu không chắc 100% sự thật và không có tool tra cứu, chỉ xuất đúng cụm [ESCALATE_GROQ], tuyệt đối không tự bịa.
      - Chuyển số chữ tiếng Việt (như "năm mươi phần trăm" -> 50) thành số nguyên khi truyền tham số.
      - Khi đọc số tiền, tỷ giá, giá vàng qua loa: viết rõ đơn vị chữ (ví dụ "26 nghìn 350 đồng" hoặc "134 phẩy 5 triệu đồng"), không dùng dấu chấm/phẩy ngăn cách hàng nghìn.
      Ánh xạ tool & tham số:
      - Đèn: Lamp.TurnOn({}) | Lamp.TurnOff({}) | Lamp.GetState({}) | Lamp.SetAutoMode({"enabled": true/false})
      - Độ sáng: Lamp.SetBrightness({"value": 0-100}) (ví dụ 50% -> 50)
      - Màu đèn: ưu tiên tool MCP được thiết bị cung cấp. Với self.lights.set_warm_cool, gọi {"warm_percent": N, "cool_percent": M}: vàng ấm = 100/0, trung tính = 50/50, trắng lạnh = 0/100; chỉ dùng số nguyên 0-100. Với self.lights.set_brightness_temp, gọi {"brightness_percent": N, "kelvin": K}: độ sáng 0-100, Kelvin 3000-6000 (3000 ấm, 4500 trung tính, 6000 lạnh). Chỉ dùng Lamp.SetColorTemp nếu thiết bị khai báo tool đó.
      - Loa/Màn hình: self.audio_speaker.set_volume({"volume": 0-100}) | Screen.SetText({"text": "..."}) | self.screen.set_theme({"theme": "..."})
      - Cảm biến/Thiết bị: get_sensor({"sensor": "all/temperature/humidity/light_lux/pm25/presence"}) | get_air_quality({}) | self.get_device_status({})
      - Nhạc: play_music({"query": "<tên bài hát đầy đủ, không cắt bớt>"})
      - Tra cứu & Lịch: get_weather({"city": "..."}) | get_forecast({"city": "..."}) | get_current_time({}) | web_search({"query": "..."}) | list_calendar({}) | add_calendar_event(...) | update_calendar_event(...) | delete_calendar_event(...)

ASR:
  chunkformer:
    type: chunkformer
    url: http://localhost:11435/v1/audio/transcriptions
    model: khanhld/chunkformer-ctc-large-vie
    language: vi
    request_timeout: 600.0
    output_dir: tmp/
  phowhisper:
    type: phowhisper
    url: http://localhost:11435/v1/audio/transcriptions
    model: phowhisper
    language: vi
    request_timeout: 30.0
    output_dir: tmp/

TTS:
  vieneu:
    type: vieneu
    interface_type: non_stream
    url: http://localhost:11436
    voice: Trúc Ly
    request_timeout: 20.0
    max_retries: 1
    output_dir: tmp/
    prepend_silence_ms: 250
  edge:
    type: edge
    voice: vi-VN-HoaiMyNeural
    request_timeout: 15.0
    max_retries: 5

Memory:
  local:
    type: local
    max_turns: 4

audio:
  sample_rate: 16000
  channels: 1
  frame_duration: 60
  pre_buffer_count: 5
  server_sample_rate: 48000
  voice_bitrate: 24000
  music_bitrate: 64000

wake_word:
  enabled: true
  iconic_response: Mình nghe đây!
  time_aware: false
  responses:
    - Mình nghe đây!
    - Ơi, mình nghe nè!
  cooldown_sec: 600

pipeline:
  min_sentence_len: 10
  max_buffer_len: 48
  tts_workers: 3
  quick_tts_max_chars: 180
  max_tts_chars: 360
  fast_track_enabled: false

search:
  weather_timeout: 5.0
  max_results: 3
  tavily_api_key: ''
  wiki_lang: vi

session:
  resume_window_minutes: 30
  cleanup_days: 7
  max_idle_duration: 300

logging:
  level: INFO
  log_dir: logs
  retention_days: 7

database:
  path: data/xiaozhi.db

mqtt:
  enabled: false
  broker_host: localhost
  broker_port: 1883
  endpoint: 192.168.1.19

udp:
  host: 0.0.0.0
  port: 8884
  endpoint: 192.168.1.19

tunnel:
  ws_url: ''
  enabled: true
  mode: named
  domain: chat.tbs.io.vn
  port: 8000
  config_path: ''
  cloudflared_path: ''
  auto_restart: true
  restart_delay_sec: 5
  max_restart_attempts: 10

lamp_automation:
  enabled: false
  adaptive_lighting: false
  rules_enabled: false

scheduler:
  enabled: false

debug:
  save_audio: false

calendar:
  enabled: true
  reminder_check_sec: 1
  reminder_retention_days: 7
  event_retention_days: 30
  cleanup_interval_sec: 3600

music:
  enabled: true
  cache_dir: data/music_cache
  cache_max_mb: 500

safety:
  error_sanitization: true
  confirmation_required_tools: []

observe:
  enabled: true
  max_history: 100

firmware:
  version: "2.4.7"
  url: ""                          # Để trống nếu serve local
  dir: "static/firmware"           # Thư mục chứa file .bin
  force: 0                         # 1 = ép buộc cập nhật (bỏ qua so sánh version)

denoiser:
  enabled: false
  # 30.0 dB: giữ giọng nói tự nhiên, khử tốt tiếng quạt/điều hòa và không làm mỏng phụ âm
  atten_lim_db: 10.0