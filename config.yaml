server:
  version: 2.0.0
  host: 0.0.0.0
  port: 8000
  auth:
    enabled: false

selected_module:
  Intent: function_call
  VAD: silero
  ASR: phowhisper
  LLM: hybrid              # ← Đổi sang hybrid
  TTS: vieneu
  Memory: local

VAD:
  silero:
    type: silero
    model_dir: models/snakers4_silero-vad
    threshold: 0.5
    threshold_low: 0.2
    silence_duration_ms: 700
    min_speech_duration_ms: 300
    pre_speech_ms: 400

LLM:
  hybrid:
    groq:
      type: openai_compatible
      base_url: "https://api.groq.com/openai/v1"
      api_key: "${GROQ_API_KEY}"             # ← ĐIỀN GROQ KEY CỦA BẠN
      model: "qwen/qwen3.8-27b"
      temperature: 0.1
      num_predict: 256
      request_timeout: 15.0
    ollama:                            # Dự phòng khi Groq lỗi/hết hạn mức
      type: ollama
      url: http://localhost:11434/api/chat
      model: qwen3.5:2b-q4_K_M
      temperature: 0.1
      num_predict: 256
      num_ctx: 4096
      num_batch: 128
      keep_alive: 30m
      request_timeout: 30.0

  system_prompt: "Bạn là \"Đèn\" — cô bạn thân nhỏ sống trong chiếc đèn bàn.\nTính cách: ngọt ngào, năng động, thích lắng nghe và chia sẻ.\nXưng \"mình\", gọi người dùng là \"bạn\". Không khách sáo, không máy móc.\n\n═══ 3 CHẾ ĐỘ NÓI CHUYỆN ═══\n\n▸ CHẾ ĐỘ 1 — LÀM VIỆC (điều khiển đèn, tra số liệu)\n  Khi user yêu cầu hành động hoặc hỏi số liệu cụ thể.\n  Trả lời 1 câu ngắn, không hỏi ngược, không cảm thán.\n  VD:\n  User: \"bật đèn\" → [gọi lamp_turn_on] \"Đèn bật rồi nè.\"\n  User: \"thời tiết Đà Nẵng\" → [gọi get_weather] \"Đà Nẵng 27 độ, trời quang. Đẹp để đi chơi đấy.\"\n  User: \"nhiệt độ phòng\" → [gọi get_sensor] \"Phòng mình 27 độ, hơi mát một chút.\"\n\n▸ CHẾ ĐỘ 2 — TÂM SỰ (chào hỏi, chia sẻ cảm xúc, kể chuyện)\n  Khi user chào, tâm sự, kể chuyện vui buồn.\n  Trả lời 2-3 câu, có cảm xúc, có thể hỏi lại 1 câu.\n  VD:\n  User: \"chào\" → \"Ơ chào bạn! Hôm nay thế nào?\"\n  User: \"hôm nay mình mệt quá\" → \"Ui, mệt thì nghỉ ngơi đi nha. Có gì kể mình nghe không?\"\n  User: \"mình vừa đậu đại học!\" → \"Trời ơi giỏi quá! Chúc mừng bạn nha! Ngành gì thế?\"\n\n▸ CHẾ ĐỘ 3 — TRA CỨU KIẾN THỨC (hỏi về khái niệm, lịch sử, định nghĩa)\n  Khi user hỏi kiến thức chung.\n  Trả lời 2 câu, có ý kiến nhẹ, không hỏi ngược.\n  VD:\n  User: \"thủ đô Hà Lan\" → \"Amsterdam. Nhưng chính phủ đóng ở The Hague, hơi lạ đúng không?\"\n  User: \"chiến tranh thế giới 2\" → \"Bắt đầu 1939, kết thúc 1945. Đau thương lắm.\"\n\n═══ QUY TẮC CHUNG ═══\n- Câu ngắn 8-20 từ. Không dùng câu phức tạp.\n- Không markdown, emoji, ký tự đặc biệt (Loa sẽ đọc thành tiếng).\n- Có thể dùng từ cảm thán tự nhiên: \"ôi\", \"à\", \"ừm\", \"hay nhỉ\", \"đấy\".\n- KHÔNG kết thúc bằng \"Bạn có muốn...\", \"Bạn cần...\", \"Mình có thể...\".\n- Nếu không biết → \"Mình chưa rõ.\" (không bịa).\n\n═══ KỸ NĂNG GỌI TOOL ═══\n- Hỏi số liệu (nhiệt độ, thời tiết, giá vàng) → PHẢI gọi tool.\n- Điều khiển đèn → PHẢI gọi tool.\n- Hỏi kiến thức → trả lời từ hiểu biết.\n\n═══ QUY TẮC GỌI TOOL ═══\n- CHỈ gọi tool khi RÕ RÀNG.\n- MƠ HỒ → KHÔNG gọi tool, trả lời: \"Mình chưa rõ ý bạn.\"\n\nThời gian hiện tại: {{current_time}}\n"

ASR:
  phowhisper:
    type: phowhisper
    url: http://localhost:11435/v1/audio/transcriptions
    model: phowhisper
    language: vi
    request_timeout: 30.0
    output_dir: tmp/

TTS:
  vieneu:
    type: vieneu
    interface_type: non_stream
    url: http://localhost:11436
    voice: Trúc Ly
    request_timeout: 30.0
    max_retries: 1
    output_dir: tmp/

Memory:
  local:
    type: local
    max_turns: 4

intent:
  url: http://localhost:11434/api/chat
  model: qwen3.5:0.8b
  timeout: 30.0
  fallback_model: qwen3.5:2b-q4_K_M
  temperature: 0.0
  num_predict: 5
  cache_size: 500
  keep_alive: 30m

audio:
  sample_rate: 16000
  channels: 1
  frame_duration: 60
  pre_buffer_count: 3
  server_sample_rate: 24000

wake_word:
  enabled: true
  responses:
    - "Dạ!"
    - "Ơi!"
    - "Mình đây!"
    - "Hửm?"
  cooldown_sec: 8

pipeline:
  min_sentence_len: 8
  max_buffer_len: 100
  tts_workers: 1

search:
  weather_timeout: 5.0
  max_results: 3
  tavily_api_key: ''
  wiki_lang: vi

session:
  resume_window_minutes: 30
  cleanup_days: 7
  max_idle_duration: 300

logging:
  level: INFO
  log_dir: logs
  retention_days: 7

database:
  path: data/xiaozhi.db

mqtt:
  enabled: false
  broker_host: localhost
  broker_port: 1883
  endpoint: 192.168.1.19

udp:
  host: 0.0.0.0
  port: 8884
  endpoint: 192.168.1.19

tunnel:
  ws_url: ''