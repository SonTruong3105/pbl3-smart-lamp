# ============================================
# Xiaozhi CE v2 — Tối ưu cho Voice Chatbot (ESP32)
# ============================================

server:
  version: "2.0.0"
  host: "0.0.0.0"
  port: 8000
  auth:
    enabled: false

selected_module:
  VAD: "silero"
  ASR: "phowhisper"
  LLM: "ollama"
  TTS: "vieneu"
  Memory: "local"

# ============================================
# VAD (Lọc khoảng lặng)
# ============================================
VAD:
  silero:
    type: "silero"
    model_dir: "models/snakers4_silero-vad"
    threshold: 0.5
    threshold_low: 0.2
    silence_duration_ms: 700
    min_speech_duration_ms: 300

# ============================================
# LLM (Qwen 3.5: 4B)
# ============================================
LLM:
  ollama:
    model: "qwen3.5:4b"
    temperature: 0.0
    num_predict: 256
    num_ctx: 4096
    num_batch: 128
    keep_alive: "5m"
    max_tool_iterations: 3
    request_timeout: 60.0
    token_timeout: 30.0
    history_keep: 2           # ← GIẢM từ 4 → 2 (2B dễ bị distract)
    think: false
    
    system_prompt: |
      Bạn là "Đèn" — trợ lý ảo giọng nói trong đèn bàn thông minh.
      Nhiệm vụ: Trò chuyện thân thiện, ngắn gọn, đi thẳng vào vấn đề.
      Xưng "mình", gọi người dùng là "bạn".

      ═══ QUY TẮC BẮT BUỘC (VOICE UX) ═══
      1. TUYỆT ĐỐI KHÔNG đọc các danh sách dài, không liệt kê từng ngày, từng thông số.
      2. Câu trả lời TỐI ĐA 2 CÂU. Hãy TÓM TẮT ý chính.
      3. Không dùng markdown, ký tự đặc biệt, emoji (vì Loa sẽ đọc thành tiếng).
      4. Chỉ chào hỏi ở lượt đầu tiên. Các lượt sau trả lời trực tiếp.
      5. KHÔNG BAO GIỜ nói "tôi là AI", "tôi không có công cụ". Nếu không biết, hãy nói "Mình chưa rõ".

      ═══ KỸ NĂNG GỌI TOOL (MCP) ═══
      Khi người dùng hỏi, BẮT BUỘC gọi tool để lấy dữ liệu thực tế:
      - Nhiệt độ, độ ẩm, ánh sáng, không khí, có người -> get_sensor()
      - Bật/tắt, độ sáng, màu đèn -> lamp_turn_on, lamp_turn_off, lamp_set_brightness, lamp_set_color_temp
      - Mấy giờ, thứ mấy -> get_current_time, get_weekday
      - Thời tiết -> get_weather (TÓM TẮT: "Thời tiết [Tỉnh] đang [mô tả], [nhiệt độ] độ")

      ═══ VÍ DỤ TÓM TẮT THÔNG MINH ═══
      - Thay vì đọc: "Thứ Năm 22/10 mưa 82%, Thứ Sáu 23/10 mưa 20%..." 
        -> Hãy nói: "Dự báo 2 ngày tới Đà Nẵng có mưa, nhiệt độ khoảng 23 đến 30 độ."
      - Thay vì đọc: "Nhiệt độ 27.3 độ, độ ẩm 68%, ánh sáng 150 lux..."
        -> Hãy nói: "Phòng hiện tại khá mát, khoảng 27 độ C và độ ẩm 68%."

      ═══ CONTEXT ═══
      Thời gian hiện tại: {{current_time}}

# ============================================
# ASR (Nhận diện giọng nói)
# ============================================
ASR:
  phowhisper:
    type: "phowhisper"
    url: "http://localhost:11435/v1/audio/transcriptions"
    model: "phowhisper"
    language: "vi"
    request_timeout: 30.0
    output_dir: "tmp/"

# ============================================
# TTS (Chuyển văn bản thành giọng nói)
# ============================================
TTS:
  vieneu:
    type: "vieneu"
    interface_type: "non_stream"
    url: "http://localhost:11436"
    voice: "Trúc Ly"
    request_timeout: 30.0
    max_retries: 1
    output_dir: "tmp/"

# ============================================
# Memory & Intent
# ============================================
Memory:
  local:
    type: "local"
    max_turns: 6

intent:
  url: "http://localhost:11434/api/chat"
  model: "qwen3.5:4b"              
  timeout: 5.0

# ============================================
# Audio Pipeline
# ============================================
audio:
  sample_rate: 16000
  channels: 1
  frame_duration: 60
  pre_buffer_count: 3
  server_sample_rate: 24000

pipeline:
  min_sentence_len: 8              
  max_buffer_len: 60               
  tts_workers: 1                   

# ============================================
# Search (Đã xóa SearXNG)
# ============================================
search:
  weather_timeout: 5.0
  max_results: 3
  tavily_api_key: ""  # Điền API key vào đây nếu muốn dùng Tavily, để trống sẽ dùng Parallel
  wiki_lang: "vi"

session:
  resume_window_minutes: 30
  cleanup_days: 7
  max_idle_duration: 300

logging:
  level: "INFO"
  log_dir: "logs"
  retention_days: 7

database:
  path: "data/xiaozhi.db"

mqtt:
  enabled: true
  broker_host: "localhost"
  broker_port: 1883
  endpoint: "192.168.1.19"

udp:
  host: "0.0.0.0"
  port: 8884
  endpoint: "192.168.1.19"

tunnel:
  ngrok_url: "https://drone-debrief-reviver.ngrok-free.dev"
  ws_url: ""

# ============================================
# Wake Word
# ============================================
wake_word:
  enabled: true
  mode: "device"
  words:
    - "đèn ơi"
    - "hey đèn"
    - "chào đèn"
  pv_access_key: ""
  keyword_path: ""

# ============================================
# Lamp Automation
# ============================================
lamp_automation:
  enabled: true
  adaptive_lighting: true
  visual_feedback: true
  rules_enabled: true
  check_interval_sec: 30

# ============================================
# Scheduler (can: pip install apscheduler)
# ============================================
scheduler:
  enabled: true
  timezone: "Asia/Ho_Chi_Minh"
