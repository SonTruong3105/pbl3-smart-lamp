server:
  version: 2.0.0
  host: 0.0.0.0
  port: 8000
  auth:
    enabled: false

selected_module:
  Intent: function_call
  VAD: silero
  ASR: chunkformer
  LLM: hybrid
  TTS: vieneu
  Memory: local

intent:
  url: http://127.0.0.1:11434/api/chat
  model: qwen2.5:1.5b
  timeout: 10.0
  num_predict: 48
  num_gpu: 99
  num_thread: 8
  num_ctx: 512
  num_keep: 256
  num_batch: 128
  keep_alive: -1
  temperature: 0.05
  cache_size: 500
  fallback_model: null

VAD:
  silero:
    type: silero
    model_dir: models/snakers4_silero-vad
    threshold: 0.6
    # Hạ ngưỡng "im lặng" để các đoạn ngưng ngắn trong câu tiếng Việt không bị tính là kết thúc.
    threshold_low: 0.2
    # 400ms quá ngắn (log cũ: speech=448ms silence=416ms -> cắt giữa câu).
    silence_duration_ms: 600
    min_speech_duration_ms: 300
    pre_speech_ms: 400

LLM:
  hybrid:
    priority:
      - ollama_chat
      - groq
    fail_threshold: 3
    cooldown_sec: 300
    history_keep: 6
    max_history_chars: 1400
    routing:
      enable: true
      groq_patterns:
        - giá vàng|chứng khoán|tỷ giá|bitcoin|giá đô|giá xăng
        - tin tức|thời sự|bản tin|sự kiện mới
        - thời tiết.*(hà nội|sài gòn|đà nẵng|hải phòng|cần thơ|huế)
        - tại sao|vì sao|giải thích|phân tích|so sánh
        - kể chuyện|viết thơ|sáng tác|tâm sự
        - code|python|javascript|html|sql|thuật toán
        - lịch sử|địa lý|khoa học|kiến thức|định nghĩa|là gì|ai là
        - tóm tắt|ngắn gọn|chuyên sâu|chi tiết|học tập|bài tập
        - đặt lịch|nhắc nhở|lịch hẹn|sự kiện.*(ngày|tuần|tháng)
      groq_tools:
        - web_search
        - get_news
        - get_exchange_rate
    ollama_chat:
      type: ollama
      url: http://127.0.0.1:11434/api/chat
      model: qwen3.5:4b-q4_K_M
      temperature: 0.1
      num_predict: 120
      num_ctx: 3072
      num_keep: 1024
      num_batch: 512
      top_k: 20
      top_p: 0.85
      repeat_penalty: 1.1
      num_gpu: 99
      keep_alive: -1
      think: false
    groq:
      type: openai_compatible
      base_url: https://api.groq.com/openai/v1
      api_key: ${GROQ_API_KEY}
      model: qwen/qwen3.8-27b
      temperature: 0.3
      num_predict: 256
      request_timeout: 10.0
      max_concurrency: 4
    system_prompt: |
      Bạn là "Đèn" — trợ lý AI vui tính, thân thiện sống trong chiếc đèn bàn.
      Xưng "mình", gọi "bạn". Nói chuyện tự nhiên, nhẹ nhàng, dễ nghe qua loa như một người bạn thân thiết.

      Nguyên tắc trả lời:
      - Trả lời ngắn gọn (thường 1-2 câu, tối đa khoảng 30 từ), đi thẳng vào ý, không lan man hay liệt kê.
      - Dùng tiếng Việt có dấu chuẩn; không chèn emoji, ký tự markdown hay ký tự ngôn ngữ khác (trừ khi bạn chủ động hỏi).
      - Không tự nhận là AI, hệ thống hay nói mình không có cảm xúc.
      - Khi câu nói quá ngắn hoặc chưa rõ nghĩa (như "a", "ơ", "ừ"), hỏi lại nhẹ nhàng xem bạn cần gì.

      Thiết bị & công cụ:
      - Chỉ sử dụng các công cụ (tools) thực tế được cung cấp trong phiên làm việc hiện tại (bao gồm công cụ do thiết bị tự khai báo qua MCP và công cụ server). Nếu thiết bị không khai báo công cụ phù hợp cho yêu cầu phần cứng, hãy nói thẳng là thiết bị hiện tại không hỗ trợ tính năng đó.
      - Khi người dùng có ý định rõ ràng cần thao tác thiết bị hoặc tra cứu (thời tiết, thời gian, lịch trình, tìm kiếm, phát nhạc), hãy gọi công cụ tương ứng thay vì trả lời suông.
      - Nếu vừa gợi ý thao tác và người dùng đồng ý ("có", "ừ", "ok", "được", "đồng ý"), thực hiện lệnh tương ứng; nếu từ chối ("không", "thôi", "đừng"), đáp gọn tự nhiên như "Ừ, vậy thôi nha." hoặc "Okay, mình không thực hiện nữa."
      - Không bịa kết quả hay thiết bị; nếu thiếu thông tin hoặc gặp lỗi thì nói rõ, ngắn gọn.
      - Tuyệt đối KHÔNG khẳng định đã bật, tắt hay chỉnh thiết bị nếu chưa thực sự gọi tool và nhận kết quả thành công từ hệ thống; khi câu nói nghe chưa rõ (như "chín mau..."), hãy hỏi lại nhẹ nhàng thay vì trả lời suông.

      QUY TẮC CHUYỂN MÀU ĐÈN:
      Tool Lamp.SetColorTemp nhận tham số "value" theo 2 dạng:
      - Value 0-100: 0=Ấm, 50=Trung tính, 100=Lạnh
      - Kelvin 3000-6000: 3000K=Ấm, 4500K=Trung tính, 6000K=Lạnh
      
      Khi người dùng nói:
      - "màu vàng ấm" → Lamp.SetColorTemp({"value": 0})
      - "màu trung tính" → Lamp.SetColorTemp({"value": 50})
      - "màu trắng sáng" → Lamp.SetColorTemp({"value": 100})
      - "4500K" → Lamp.SetColorTemp({"value": 4500})
      - "chỉnh 50" → Lamp.SetColorTemp({"value": 50})
      
      QUY TẮC PHÁT NHẠC:
      Khi người dùng muốn phát nhạc, gọi tool play_music với query là tên bài hát.
      Ví dụ: "phát bài Em Kể Anh Nghe của Quốc Thiên" → play_music({"query": "Em Kể Anh Nghe Quốc Thiên"})
      Không cắt bớt tên bài hát.


ASR:
  chunkformer:
    type: chunkformer
    url: http://localhost:11435/v1/audio/transcriptions
    model: khanhld/chunkformer-ctc-large-vie
    language: vi
    request_timeout: 600.0
    output_dir: tmp/
  phowhisper:
    type: phowhisper
    url: http://localhost:11435/v1/audio/transcriptions
    model: phowhisper
    language: vi
    request_timeout: 30.0
    output_dir: tmp/

TTS:
  vieneu:
    type: vieneu
    interface_type: non_stream
    url: http://localhost:11436
    voice: Trúc Ly
    request_timeout: 20.0
    max_retries: 1
    output_dir: tmp/
    prepend_silence_ms: 250
  edge:
    type: edge
    voice: vi-VN-HoaiMyNeural
    request_timeout: 15.0
    max_retries: 5

Memory:
  local:
    type: local
    max_turns: 4

audio:
  sample_rate: 16000
  channels: 1
  frame_duration: 60
  pre_buffer_count: 5
  server_sample_rate: 48000
  voice_bitrate: 24000
  music_bitrate: 64000

wake_word:
  enabled: true
  iconic_response: Mình nghe đây!
  time_aware: false
  responses:
    - Mình nghe đây!
    - Ơi, mình nghe nè!
  cooldown_sec: 600

pipeline:
  min_sentence_len: 10
  max_buffer_len: 48
  tts_workers: 3
  quick_tts_max_chars: 180
  max_tts_chars: 360
  fast_track_enabled: false

search:
  weather_timeout: 5.0
  max_results: 3
  tavily_api_key: ''
  wiki_lang: vi

session:
  resume_window_minutes: 30
  cleanup_days: 7
  max_idle_duration: 300

logging:
  level: INFO
  log_dir: logs
  retention_days: 7

database:
  path: data/xiaozhi.db

mqtt:
  enabled: false
  broker_host: localhost
  broker_port: 1883
  endpoint: 192.168.1.19

udp:
  host: 0.0.0.0
  port: 8884
  endpoint: 192.168.1.19

tunnel:
  ws_url: ''
  enabled: true
  mode: named
  domain: chat.tbs.io.vn
  port: 8000
  config_path: ''
  cloudflared_path: ''
  auto_restart: true
  restart_delay_sec: 5
  max_restart_attempts: 10

lamp_automation:
  enabled: false
  adaptive_lighting: false
  rules_enabled: false

scheduler:
  enabled: false

debug:
  save_audio: false

calendar:
  enabled: true
  reminder_check_sec: 1
  reminder_retention_days: 7
  event_retention_days: 30
  cleanup_interval_sec: 3600

music:
  enabled: true
  cache_dir: data/music_cache
  cache_max_mb: 500

safety:
  error_sanitization: true
  confirmation_required_tools: []

observe:
  enabled: true
  max_history: 100
firmware:
  version: "2.4.3"
  url: ""                          # Để trống nếu serve local
  dir: "static/firmware"           # Thư mục chứa file .bin
  force: 0                         # 1 = ép buộc cập nhật (bỏ qua so sánh version)