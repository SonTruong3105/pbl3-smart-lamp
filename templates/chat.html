<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaozhi Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

  <header class="bg-white shadow-sm px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🤖</span>
      <h1 class="font-bold text-lg">Xiaozhi Chat</h1>
      <span id="status" class="text-xs px-2 py-1 rounded bg-yellow-100 text-yellow-800">Đang kết nối...</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="sessionInfo" class="text-sm text-slate-500"></span>
      <a href="/admin" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded">⚙️ Admin</a>
    </div>
  </header>

  <main id="chatBox" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-3xl mx-auto w-full">
    <div class="text-center text-slate-400 text-sm py-8">
      Bắt đầu trò chuyện với trợ lý AI — gõ text hoặc nhấn 🎤 để nói
    </div>
  </main>

  <footer class="bg-white border-t px-4 py-3">
    <div class="max-w-3xl mx-auto flex gap-2">
      <button id="micBtn"
        class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
        🎤 Nói
      </button>
      <input id="input" type="text" placeholder="Nhập tin nhắn..."
        class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        autocomplete="off">
      <button id="sendBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium disabled:opacity-50">
        Gửi
      </button>
    </div>
  </footer>

  <script src="/static/js/chat.js"></script>
</body>
</html>
